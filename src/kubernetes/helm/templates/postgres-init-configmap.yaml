apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init-scripts
  namespace: {{ .Values.global.namespace }}
  labels:
    chart: {{ include "cinemaabyss.chart" . }}
    release: {{ .Release.Name }}
data:
  init.sql: |
    -- Initialize CinemaAbyss Database Schema

    -- Enable UUID extension
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- Create users table
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(100) NOT NULL UNIQUE,
        email VARCHAR(255) NOT NULL UNIQUE,
        password_hash VARCHAR(255),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create movies table
    CREATE TABLE IF NOT EXISTS movies (
        id SERIAL PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        description TEXT,
        rating DECIMAL(3, 1) CHECK (rating >= 0 AND rating <= 10),
        release_date DATE,
        duration INTEGER,
        poster_url VARCHAR(255),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create movie_genres table
    CREATE TABLE IF NOT EXISTS movie_genres (
        movie_id INTEGER REFERENCES movies(id) ON DELETE CASCADE,
        genre VARCHAR(50) NOT NULL,
        PRIMARY KEY (movie_id, genre)
    );

    -- Create payments table
    CREATE TABLE IF NOT EXISTS payments (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id) ON DELETE CASCADE,
        amount DECIMAL(10, 2) NOT NULL,
        timestamp TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        status VARCHAR(50) DEFAULT 'completed',
        payment_method VARCHAR(50),
        transaction_id VARCHAR(255)
    );

    -- Create subscriptions table
    CREATE TABLE IF NOT EXISTS subscriptions (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id) ON DELETE CASCADE,
        plan_type VARCHAR(50) NOT NULL,
        start_date TIMESTAMP WITH TIME ZONE NOT NULL,
        end_date TIMESTAMP WITH TIME ZONE NOT NULL,
        auto_renew BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Insert sample data
    INSERT INTO users (username, email) VALUES
        ('user1', 'user1@example.com'),
        ('user2', 'user2@example.com'),
        ('user3', 'user3@example.com')
    ON CONFLICT (username) DO NOTHING;

    INSERT INTO movies (title, description, rating) VALUES
        ('The Shawshank Redemption', 'Two imprisoned men bond over a number of years', 9.3),
        ('The Godfather', 'The aging patriarch transfers control to his son', 9.2),
        ('The Dark Knight', 'Batman fights the Joker in Gotham', 9.0)
    ON CONFLICT (id) DO NOTHING;

    INSERT INTO movie_genres (movie_id, genre) VALUES
        (1, 'Drama'),
        (2, 'Crime'),
        (2, 'Drama'),
        (3, 'Action'),
        (3, 'Crime')
    ON CONFLICT (movie_id, genre) DO NOTHING;