{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    chart: {{ include "cinemaabyss.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eventsService.replicaCount }}
  selector:
    matchLabels:
      app: events-service
  template:
    metadata:
      labels:
        app: events-service
    spec:
      {{- if .Values.imagePullSecrets.dockerconfigjson }}
      imagePullSecrets:
      - name: {{ .Release.Name }}-dockerconfig
      {{- end }}
      containers:
      - name: events-service
        image: "{{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag }}"
        imagePullPolicy: {{ .Values.eventsService.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.eventsService.service.port }}
        env:
        - name: PORT
          value: {{ .Values.eventsService.env.PORT | quote }}
        - name: KAFKA_BROKER
          value: {{ .Values.eventsService.env.KAFKA_BROKER | quote }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.eventsService.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.eventsService.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    chart: {{ include "cinemaabyss.chart" . }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.eventsService.service.type }}
  ports:
  - port: {{ .Values.eventsService.service.port }}
    targetPort: {{ .Values.eventsService.service.port }}
    protocol: TCP
  selector:
    app: events-service
{{- end }}