{{- if .Values.moviesService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-movies-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: movies-service
    chart: {{ include "cinemaabyss.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.moviesService.replicaCount }}
  selector:
    matchLabels:
      app: movies-service
  template:
    metadata:
      labels:
        app: movies-service
    spec:
      {{- if .Values.imagePullSecrets.dockerconfigjson }}
      imagePullSecrets:
      - name: {{ .Release.Name }}-dockerconfig
      {{- end }}
      containers:
      - name: movies-service
        image: "{{ .Values.moviesService.image.repository }}:{{ .Values.moviesService.image.tag }}"
        imagePullPolicy: {{ .Values.moviesService.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.moviesService.service.port }}
        env:
        - name: PORT
          value: {{ .Values.moviesService.env.PORT | quote }}
        - name: DB_CONNECTION_STRING
          value: "postgres://postgres:$(DB_PASSWORD)@{{ .Release.Name }}-postgresql:5432/cinemaabyss?sslmode=disable"
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-config
        - secretRef:
            name: {{ .Release.Name }}-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.moviesService.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.moviesService.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-movies-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: movies-service
    chart: {{ include "cinemaabyss.chart" . }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.moviesService.service.type }}
  ports:
  - port: {{ .Values.moviesService.service.port }}
    targetPort: {{ .Values.moviesService.service.port }}
    protocol: TCP
  selector:
    app: movies-service
{{- end }}