name: API Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string
  repository_dispatch:
    types: [run-api-tests]

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          
          timeout 180s bash -c 'until docker compose logs proxy-service | grep "Proxy service running on port"; do sleep 5; done'
          timeout 180s bash -c 'until docker compose logs monolith | grep "Starting server on port"; do sleep 5; done'
          timeout 180s bash -c 'until docker compose logs movies-service | grep "Starting movies microservice"; do sleep 5; done'
          timeout 180s bash -c 'until docker compose logs events-service | grep "Events service running"; do sleep 5; done'

          sleep 30
          
          echo "Checking service health..."
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:8081/api/movies/health || exit 1
          curl -f http://localhost:8082/health || exit 1
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: |
          npm install
          npm list newman
      
      - name: Wait for services to be fully ready
        run: |
          echo "Testing API endpoints..."
          curl -f http://localhost:8000/api/movies || echo "Movies endpoint might return error but service is up"
          curl -f http://localhost:8000/api/events/health || echo "Events health might not be implemented yet"
          sleep 10
      
      - name: Run API tests
        working-directory: tests/postman
        env:
          BASE_URL: http://localhost:8000
        run: |
          mkdir -p reports
          
          node run-tests.js -e local || echo "Some tests failed, but continuing..."
          
          npx newman run "CinemaAbyss.postman_collection.json" \
            -e "local.environment.json" \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export reports/api-test-report.html \
            --reporter-junit-export reports/junit-report.xml \
            --timeout-request 15000 \
            --delay-request 1000 || echo "Tests completed with some failures"
      
      - name: Upload test reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: api-test-reports
          path: |
            tests/postman/reports/
          retention-days: 30
      
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Proxy Service Logs ==="
          docker compose logs proxy-service
          echo "=== Monolith Logs ==="
          docker compose logs monolith
          echo "=== Movies Service Logs ==="
          docker compose logs movies-service
          echo "=== Events Service Logs ==="
          docker compose logs events-service
          echo "=== Kafka Logs ==="
          docker compose logs kafka
      
      - name: Stop services
        if: always()
        run: docker compose down