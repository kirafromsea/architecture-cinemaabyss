name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published, created, edited]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Monolith
      - name: Build and push Monolith
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Movies Service
      - name: Build and push Movies Service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proxy Service
      - name: Build and push Proxy Service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Events Service
      - name: Build and push Events Service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install dependencies
        run: |
          cd tests/postman
          npm ci

      - name: Run API Tests
        run: |
          cd tests/postman
          npm run test:local
        env:
          API_BASE_URL: http://localhost:8000
        continue-on-error: true

  verify-images:
    name: Verify Multi-arch Images
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Check multi-arch support
        run: |
          echo "Verifying multi-arch images were built..."
          echo "Monolith: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}"
          echo "Movies: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}"
          echo "Events: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}"
          echo "Proxy: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}"
          
      - name: Verify image manifests
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}:latest